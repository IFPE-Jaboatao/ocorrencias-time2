# nginx.conf — Radar Acadêmico (produção)
#
# Estrutura:
#   :80  → redireciona tudo para HTTPS
#   :443 → frontend (Next.js :3000) e /api/* → backend (NestJS :3001)
#
# Antes de usar:
#   1. Substitua SEU_DOMINIO pelo domínio real (ex: radar.escola.edu.br)
#   2. Coloque os certificados em nginx/certs/:
#        - fullchain.pem  (certificado + cadeia — Let's Encrypt ou institucional)
#        - privkey.pem    (chave privada)
#      Para Let's Encrypt: certbot certonly --standalone -d SEU_DOMINIO
#   3. docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logs ────────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  keepalive_timeout 65;
  client_max_body_size 55m;   # limite de upload (50 MB de evidência + margem)

  # ── Segurança — headers globais ─────────────────────────────────────────────
  add_header X-Frame-Options        "SAMEORIGIN"    always;
  add_header X-Content-Type-Options "nosniff"       always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

  # ── Rate limiting ────────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;

  # ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
  server {
    listen 80;
    server_name SEU_DOMINIO;  # ← substitua pelo domínio real

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;  # necessário para renovação automática do Let's Encrypt
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS principal ──────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2  on;
    server_name SEU_DOMINIO;  # ← substitua pelo domínio real

    # ── Certificados TLS ──────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── API NestJS (/api/*) ───────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=40 nodelay;

      proxy_pass         http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── Magic link auth — rate limit agressivo ────────────────────────────────
    location /api/v1/auth/magic-link {
      limit_req zone=auth burst=3 nodelay;

      proxy_pass         http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend Next.js (tudo que não é /api) ────────────────────────────────
    location / {
      proxy_pass         http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
